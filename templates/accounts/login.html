{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<h1>Login</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit">Login</button>
</form>

<hr>

<p>Don't have an account?</p>
<a href="{% url 'signup' %}">
    <button type="button">Sign Up</button>
</a>
{% endblock %}
